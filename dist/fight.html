<title>Iron Lantern</title>
<style>

  :root { --ink:#efe4d2; --bg:#07080b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; overflow:hidden;
    overscroll-behavior:none; touch-action:none; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #wrap { display:flex; align-items:center; justify-content:center; }
  canvas { display:block; background:#000; box-shadow:0 10px 60px rgba(0,0,0,.75); }
  #pad { display:none; width:100%; padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    gap:8px; justify-content:space-between; align-items:flex-end; }
  .cl { display:flex; gap:7px; }
  .btn { width:52px; height:48px; border-radius:10px; border:1px solid #4a4048;
    background:rgba(28,24,30,.9); color:var(--ink); font-size:15px; font-weight:700;
    display:flex; align-items:center; justify-content:center; user-select:none; }
  .btn.on { background:#7a6250; border-color:#c8a888; }
  .btn.big { width:58px; height:54px; }
  #hint { font-size:11px; opacity:.42; padding:5px; text-align:center; letter-spacing:.05em; }
  @media (pointer:coarse), (max-width:820px) { #pad { display:flex; } #hint { display:none; } }

</style>
<div id="wrap"><canvas id="screen"></canvas></div>
  <div id="hint">&larr;&rarr; move &nbsp;·&nbsp; &uarr; jump &nbsp;·&nbsp; &darr; duck &nbsp;·&nbsp; A punch &nbsp;·&nbsp; S kick &nbsp;·&nbsp; D throw &nbsp;·&nbsp; F super &nbsp;·&nbsp; back to block</div>
  <div id="pad">
    <div class="cl">
      <div class="btn" data-k="l">&#9664;</div>
      <div class="btn" data-k="d">&#9660;</div>
      <div class="btn" data-k="u">&#9650;</div>
      <div class="btn" data-k="r">&#9654;</div>
    </div>
    <div class="cl">
      <div class="btn big" data-k="g">THR</div>
      <div class="btn big" data-k="s">SUP</div>
      <div class="btn big" data-k="k">KICK</div>
      <div class="btn big" data-k="p">PUN</div>
    </div>
  </div>
<script>
/* ===== src/fx/surface.js ===== */
/*
 * surface.js -- a 32-bit software surface.
 *
 * The indexed 8-bit framebuffer this engine started with was an authenticity
 * choice, and it capped what the renderer could ever look like: no blending,
 * so no glow, no soft shadow, no motion trail, and shading limited to
 * whatever fitted in a palette ramp.
 *
 * This replaces it with a straight RGBA surface. Everything is still done in
 * software, by hand, one pixel at a time -- there is exactly one canvas call
 * in the whole renderer (putImageData) and no GPU anywhere. What changes is
 * only the range: 24-bit colour and an alpha channel, which is what makes
 * lighting and effects possible at all.
 *
 * Colours are packed 0xAABBGGRR to match the little-endian byte order of
 * ImageData, so a pixel is one 32-bit store.
 */
var FX = FX || {};
(function (F) {
  'use strict';

  function rgb(r, g, b) {
    return (255 << 24) | ((b & 255) << 16) | ((g & 255) << 8) | (r & 255);
  }
  function rgba(r, g, b, a) {
    return ((a & 255) << 24) | ((b & 255) << 16) | ((g & 255) << 8) | (r & 255);
  }

  function Surface(w, h) {
    this.w = w; this.h = h;
    this.px = new Uint32Array(w * h);
    this.depth = new Float32Array(w * h);   // for the shaded character pass
    this.canvas = null; this.ctx = null; this.img = null; this.out = null;
  }

  Surface.prototype.attach = function (canvas) {
    this.canvas = canvas;
    canvas.width = this.w; canvas.height = this.h;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.img = this.ctx.createImageData(this.w, this.h);
    this.out = new Uint32Array(this.img.data.buffer);
  };

  /* The one and only canvas call. */
  Surface.prototype.present = function () {
    this.out.set(this.px);
    this.ctx.putImageData(this.img, 0, 0);
  };

  Surface.prototype.clear = function (c) { this.px.fill(c >>> 0); };
  Surface.prototype.copyFrom = function (other) { this.px.set(other.px); };

  /* Copy with an offset, for screen shake and parallax. Rows outside the
   * source are clamped rather than left blank. */
  Surface.prototype.copyFromOffset = function (other, dx, dy) {
    dx = dx | 0; dy = dy | 0;
    if (dx === 0 && dy === 0) { this.px.set(other.px); return; }
    var W = this.w, H = this.h, src = other.px, dst = this.px;
    for (var y = 0; y < H; y++) {
      var sy = y - dy; if (sy < 0) sy = 0; else if (sy >= H) sy = H - 1;
      var so = sy * W, dof = y * W;
      if (dx === 0) { dst.set(src.subarray(so, so + W), dof); continue; }
      // the shifted span is one contiguous row copy; only the exposed edge
      // needs filling, and it fills with the clamped edge pixel
      if (dx > 0) {
        dst.set(src.subarray(so, so + W - dx), dof + dx);
        dst.fill(src[so], dof, dof + dx);
      } else {
        var n = W + dx;
        dst.set(src.subarray(so - dx, so + W), dof);
        dst.fill(src[so + W - 1], dof + n, dof + W);
      }
    }
  };
  /* Copy a horizontal band with its own x offset. Parallax is just this,
   * called once per depth layer. */
  Surface.prototype.copyBand = function (other, y0, y1, dx) {
    dx = Math.round(dx);
    var W = this.w, src = other.px, dst = this.px;
    y0 = Math.max(0, y0 | 0); y1 = Math.min(this.h, y1 | 0);
    for (var y = y0; y < y1; y++) {
      var so = y * W, dof = y * W;
      if (dx === 0) { dst.set(src.subarray(so, so + W), dof); continue; }
      if (dx > 0) {
        dst.set(src.subarray(so, so + W - dx), dof + dx);
        dst.fill(src[so], dof, dof + dx);
      } else {
        var n = W + dx;
        dst.set(src.subarray(so - dx, so + W), dof);
        dst.fill(src[so + W - 1], dof + n, dof + W);
      }
    }
  };

  Surface.prototype.clearDepth = function () { this.depth.fill(1e9); };

  /* Clear only a rectangle of the depth buffer -- the characters occupy a
   * small part of the screen, and clearing half a megabyte of float per
   * frame for that would be most of the frame budget. */
  Surface.prototype.clearDepthRect = function (x0, y0, x1, y1) {
    x0 = Math.max(0, x0 | 0); y0 = Math.max(0, y0 | 0);
    x1 = Math.min(this.w, x1 | 0); y1 = Math.min(this.h, y1 | 0);
    for (var y = y0; y < y1; y++) this.depth.fill(1e9, y * this.w + x0, y * this.w + x1);
  };

  Surface.prototype.fillRect = function (x, y, w, h, c) {
    var x0 = Math.max(0, x | 0), y0 = Math.max(0, y | 0);
    var x1 = Math.min(this.w, (x + w) | 0), y1 = Math.min(this.h, (y + h) | 0);
    if (x1 <= x0) return;
    for (var yy = y0; yy < y1; yy++) this.px.fill(c >>> 0, yy * this.w + x0, yy * this.w + x1);
  };

  /* Source-over blend of a flat colour. `a` is 0..1. */
  Surface.prototype.blendRect = function (x, y, w, h, r, g, b, a) {
    var x0 = Math.max(0, x | 0), y0 = Math.max(0, y | 0);
    var x1 = Math.min(this.w, (x + w) | 0), y1 = Math.min(this.h, (y + h) | 0);
    if (x1 <= x0 || a <= 0) return;
    var p = this.px, W = this.w;
    var ia = 1 - a, ra = r * a, ga = g * a, ba = b * a;
    for (var yy = y0; yy < y1; yy++) {
      var o = yy * W;
      for (var xx = x0; xx < x1; xx++) {
        var i = o + xx, v = p[i];
        p[i] = 0xff000000 |
          ((((v >>> 16) & 255) * ia + ba) << 16) |
          ((((v >>> 8) & 255) * ia + ga) << 8) |
          (((v & 255) * ia + ra));
      }
    }
  };

  Surface.prototype.blendPx = function (x, y, r, g, b, a) {
    if (x < 0 || y < 0 || x >= this.w || y >= this.h || a <= 0) return;
    if (a > 1) a = 1;
    var i = y * this.w + x, v = this.px[i], ia = 1 - a;
    this.px[i] = 0xff000000 |
      (((((v >>> 16) & 255) * ia + b * a) | 0) << 16) |
      (((((v >>> 8) & 255) * ia + g * a) | 0) << 8) |
      ((((v & 255) * ia + r * a) | 0));
  };

  /* Additive -- glows, sparks, fire. */
  Surface.prototype.addPx = function (x, y, r, g, b, a) {
    if (x < 0 || y < 0 || x >= this.w || y >= this.h || a <= 0) return;
    var i = y * this.w + x, v = this.px[i];
    var nr = (v & 255) + r * a, ng = ((v >>> 8) & 255) + g * a, nb = ((v >>> 16) & 255) + b * a;
    this.px[i] = 0xff000000 |
      ((nb > 255 ? 255 : nb | 0) << 16) | ((ng > 255 ? 255 : ng | 0) << 8) | (nr > 255 ? 255 : nr | 0);
  };

  Surface.prototype.addDisc = function (cx, cy, rad, r, g, b, a) {
    var x0 = Math.max(0, Math.floor(cx - rad)), x1 = Math.min(this.w - 1, Math.ceil(cx + rad));
    var y0 = Math.max(0, Math.floor(cy - rad)), y1 = Math.min(this.h - 1, Math.ceil(cy + rad));
    var r2 = rad * rad;
    for (var y = y0; y <= y1; y++) {
      var dy = y - cy;
      for (var x = x0; x <= x1; x++) {
        var dx = x - cx, d2 = dx * dx + dy * dy;
        if (d2 > r2) continue;
        var f = 1 - Math.sqrt(d2) / rad;
        this.addPx(x, y, r, g, b, a * f * f);
      }
    }
  };

  /* Soft elliptical shadow -- multiply, so it darkens whatever is under it. */
  Surface.prototype.shadowEllipse = function (cx, cy, rx, ry, strength) {
    var x0 = Math.max(0, Math.floor(cx - rx)), x1 = Math.min(this.w - 1, Math.ceil(cx + rx));
    var y0 = Math.max(0, Math.floor(cy - ry)), y1 = Math.min(this.h - 1, Math.ceil(cy + ry));
    var p = this.px, W = this.w;
    for (var y = y0; y <= y1; y++) {
      var dy = (y - cy) / ry;
      for (var x = x0; x <= x1; x++) {
        var dx = (x - cx) / rx, d = dx * dx + dy * dy;
        if (d >= 1) continue;
        var k = 1 - strength * (1 - d) * (1 - d);
        var i = y * W + x, v = p[i];
        p[i] = 0xff000000 |
          (((((v >>> 16) & 255) * k) | 0) << 16) |
          (((((v >>> 8) & 255) * k) | 0) << 8) |
          ((((v & 255) * k) | 0));
      }
    }
  };

  /* Vertical gradient, used for skies and stage washes. */
  Surface.prototype.gradientV = function (x, y, w, h, c0, c1) {
    var y0 = Math.max(0, y | 0), y1 = Math.min(this.h, (y + h) | 0);
    var r0 = c0 & 255, g0 = (c0 >>> 8) & 255, b0 = (c0 >>> 16) & 255;
    var r1 = c1 & 255, g1 = (c1 >>> 8) & 255, b1 = (c1 >>> 16) & 255;
    for (var yy = y0; yy < y1; yy++) {
      var t = h <= 1 ? 0 : (yy - y) / (h - 1);
      var c = rgb(r0 + (r1 - r0) * t, g0 + (g1 - g0) * t, b0 + (b1 - b0) * t);
      this.fillRect(x, yy, w, 1, c);
    }
  };

  /* Soft alpha disc -- dust and smoke. Drawing these as squares was
   * leaving grey blocks on the floor. */
  Surface.prototype.blendDisc = function (cx, cy, rad, r, g, b, a) {
    var x0 = Math.max(0, Math.floor(cx - rad)), x1 = Math.min(this.w - 1, Math.ceil(cx + rad));
    var y0 = Math.max(0, Math.floor(cy - rad)), y1 = Math.min(this.h - 1, Math.ceil(cy + rad));
    var r2 = rad * rad;
    for (var y = y0; y <= y1; y++) {
      var dy = y - cy;
      for (var x = x0; x <= x1; x++) {
        var dx = x - cx, d2 = dx * dx + dy * dy;
        if (d2 > r2) continue;
        var f = 1 - d2 / r2;
        this.blendPx(x, y, r, g, b, a * f);
      }
    }
  };

  /* A soft additive streak along a segment -- motion arcs, no shading. */
  Surface.prototype.addStreak = function (ax, ay, bx, by, rad, r, g, b, a) {
    var dx = bx - ax, dy = by - ay;
    var n = Math.max(2, Math.min(22, Math.sqrt(dx * dx + dy * dy) / 3 | 0));
    for (var i = 0; i <= n; i++) {
      var t = i / n;
      this.addDisc(ax + dx * t, ay + dy * t, rad, r, g, b, a);
    }
  };

  F.Surface = Surface;
  F.rgb = rgb;
  F.rgba = rgba;
})(FX);

/* ===== src/fx/shade.js ===== */
/*
 * shade.js -- per-pixel lit primitives.
 *
 * The reason this engine can afford to look modern is that it *generates*
 * its geometry. A sprite is a finished picture: whatever shading it has was
 * painted once and can never respond to anything. A capsule defined by two
 * endpoints and two radii still knows its own shape at render time, so for
 * every pixel we can recover a surface normal and light it properly.
 *
 * Each limb is treated as a capsule swept in Z as well as X/Y -- a rounded
 * tube seen side-on. For a pixel at signed offset u across the tube (-1 at
 * one silhouette edge, +1 at the other) the surface normal is
 *
 *     N = perp * u  +  z * sqrt(1 - u^2)
 *
 * which is exact for a cylinder, and gives a real Lambert term, a real
 * specular highlight and a real rim light. Depth comes out of the same
 * expression, so limbs occlude each other correctly instead of relying on
 * paint order.
 *
 * Everything here is forward-shaded straight into the surface with a depth
 * test, and silhouette pixels are coverage-blended, so edges are smooth
 * without a separate anti-aliasing pass.
 */
var FX = FX || {};
(function (F) {
  'use strict';

  /* Materials: base colour, how shiny, how much rim. Tuned to read as
   * cloth / skin / metal rather than as tinted plastic. */
  function mat(r, g, b, spec, gloss, rim, sss) {
    return { r: r, g: g, b: b, spec: spec === undefined ? 0.12 : spec,
      gloss: gloss || 12, rim: rim === undefined ? 0.5 : rim, sss: sss || 0 };
  }
  F.mat = mat;

  // light: front, above, from the character's left
  var LX = -0.36, LY = -0.66, LZ = 0.66;
  // a second, cooler fill from the opposite side keeps shadows from going flat
  var FX2 = 0.55, FY2 = -0.15, FZ2 = 0.82;
  // back-left kicker: the rim only fires where the surface turns away from
  // the viewer *toward this direction*, which is what makes a lit side and a
  // dark side instead of a uniform glowing outline
  var BX = 0.66, BY = -0.34, BZ = -0.67;

  function Shader(surf) {
    this.s = surf;
    /* World-to-device scale. The fighter is authored in its own ~128-unit
     * space; the game lays out a 480x270 world and renders it to a denser
     * surface. One knob here beats scaling every radius by hand. */
    this.S = 1;
    this.bx0 = 0; this.by0 = 0; this.bx1 = 0; this.by1 = 0;
    this.ambR = 42; this.ambG = 46; this.ambB = 60;   // ambient/sky bounce
    this.keyR = 255; this.keyG = 238; this.keyB = 214;
    this.fillR = 90; this.fillG = 120; this.fillB = 168;
    this.rimR = 190; this.rimG = 214; this.rimB = 255;
    this.tint = 0;                                     // 0..1 hit flash
    this.tintR = 255; this.tintG = 255; this.tintB = 255;
    this.occ = []; this.nOcc = 0;
    this.ox = 0; this.oy = 0;                          // screen shake
    this.ghost = 0;                                    // >0 draws an afterimage

    /* The half-vector is a constant of the light rig, but it was being
     * rebuilt -- including a reciprocal square root -- for every shaded
     * pixel. Hoisted, it costs nothing. */
    var hx = LX, hy = LY, hz = LZ + 1;
    var hl = 1 / Math.sqrt(hx * hx + hy * hy + hz * hz);
    this.HX = hx * hl; this.HY = hy * hl; this.HZ = hz * hl;
  }

  /* Occluders are a handful of body masses in device space. Anything drawn
   * behind one darkens near it, which is what puts shadow in the armpit,
   * under the chin, under the belt and where the near arm crosses the
   * chest. Six discs is enough to read as ambient occlusion. */
  Shader.prototype.clearOcc = function () { this.nOcc = 0; };
  Shader.prototype.addOcc = function (x, y, r, z, k) {
    var S = this.S;
    var o = this.occ[this.nOcc] || (this.occ[this.nOcc] = {});
    o.x = x * S + this.ox; o.y = y * S + this.oy; o.r = r * S;
    o.r2 = o.r * o.r; o.z = z * S; o.k = k === undefined ? 0.5 : k;
    this.nOcc++;
  };

  /* Reserve a region: the depth buffer only needs clearing where we draw. */
  Shader.prototype.begin = function (x0, y0, x1, y1) {
    var S = this.S;
    x0 = x0 * S + this.ox; y0 = y0 * S + this.oy;
    x1 = x1 * S + this.ox; y1 = y1 * S + this.oy;
    this.bx0 = Math.max(0, x0 | 0); this.by0 = Math.max(0, y0 | 0);
    this.bx1 = Math.min(this.s.w, x1 | 0); this.by1 = Math.min(this.s.h, y1 | 0);
    this.s.clearDepthRect(this.bx0, this.by0, this.bx1, this.by1);
  };

  /* Shade one pixel given its normal and depth, with coverage for the edge. */
  Shader.prototype.px = function (x, y, nx, ny, nz, z, m, cov, ao) {
    // callers already clip to the shader's box; re-testing here cost a
    // branch on every covered pixel
    var s = this.s, i = y * s.w + x;
    if (z >= s.depth[i]) return;
    if (this.ghost > 0) { cov *= this.ghost; }
    else if (cov >= 0.995) s.depth[i] = z;

    var d = nx * LX + ny * LY + nz * LZ;
    if (d < 0) d = 0;
    // wrap term: skin and cloth do not fall to black at the terminator
    d = d * 0.82 + 0.18;

    var f = nx * FX2 + ny * FY2 + nz * FZ2;
    if (f < 0) f = 0;
    f *= 0.34;

    // Blinn specular against the key light
    var sp = nx * this.HX + ny * this.HY + nz * this.HZ;
    if (sp < 0) sp = 0;
    else if (m.spec > 0.001) {
      // integer gloss by repeated squaring beats Math.pow per pixel
      var e = m.gloss, acc = 1, base = sp;
      while (e > 0) { if (e & 1) acc *= base; base *= base; e >>= 1; }
      sp = acc * m.spec;
    } else sp = 0;

    // rim, gated by direction
    var rb = nx * BX + ny * BY + nz * BZ;
    if (rb < 0) rb = 0;
    var rim = 1 - nz;
    rim = rim * rim * rim * rb * m.rim * 2.0;

    var occ = ao === undefined ? 1 : ao;
    // per-pixel ambient occlusion from the body's own masses
    for (var oi = 0; oi < this.nOcc; oi++) {
      var o = this.occ[oi];
      if (z <= o.z) continue;                       // only occluders in front
      var odx = x - o.x, ody = y - o.y;
      var od2 = odx * odx + ody * ody;
      if (od2 >= o.r2) continue;
      var dz = z - o.z; if (dz > 16) dz = 16;
      occ *= 1 - o.k * (1 - od2 / o.r2) * dz * 0.0625;
    }

    // subsurface warmth on the terminator; without it the cold fill light
    // makes skin read dead
    var sss = m.sss ? m.sss * (1 - d) * (nz * 0.6 + 0.4) : 0;

    var r = ((this.ambR + this.keyR * d) * m.r / 255 + this.fillR * f * m.r / 255
      + this.keyR * sp + this.rimR * rim + 62 * sss) * occ;
    var g = ((this.ambG + this.keyG * d) * m.g / 255 + this.fillG * f * m.g / 255
      + this.keyG * sp + this.rimG * rim + 26 * sss) * occ;
    var b = ((this.ambB + this.keyB * d) * m.b / 255 + this.fillB * f * m.b / 255
      + this.keyB * sp + this.rimB * rim + 14 * sss) * occ;

    if (this.tint > 0) {
      // additive, clamped -- lerping to a flat colour turned the struck
      // fighter into a paper cutout
      var t = this.tint * 0.62;
      r += this.tintR * t; g += this.tintG * t; b += this.tintB * t;
    }
    if (r > 255) r = 255; if (g > 255) g = 255; if (b > 255) b = 255;
    if (r < 0) r = 0; if (g < 0) g = 0; if (b < 0) b = 0;

    if (cov >= 0.995) {
      s.px[i] = 0xff000000 | ((b | 0) << 16) | ((g | 0) << 8) | (r | 0);
    } else {
      var v = s.px[i], ia = 1 - cov;
      s.px[i] = 0xff000000 |
        (((((v >>> 16) & 255) * ia + b * cov) | 0) << 16) |
        (((((v >>> 8) & 255) * ia + g * cov) | 0) << 8) |
        ((((v & 255) * ia + r * cov) | 0));
    }
  };

  /* A limb. (ax,ay)-(bx,by) with radii r0..r1, lying at depth zb; the tube
   * bulges toward the viewer by its own radius, which is what makes crossing
   * limbs sort correctly. */
  Shader.prototype.capsule = function (ax, ay, bx, by, r0, r1, zb, m, ao) {
    var S = this.S;
    ax = ax * S + this.ox; ay = ay * S + this.oy;
    bx = bx * S + this.ox; by = by * S + this.oy;
    r0 *= S; r1 *= S; zb *= S;
    var dx = bx - ax, dy = by - ay;
    var seg = Math.sqrt(dx * dx + dy * dy);
    if (seg < 0.0001) { this.sphere(ax, ay, Math.max(r0, r1), zb, m, ao); return; }
    var ux = dx / seg, uy = dy / seg;
    var px = -uy, py = ux;
    var rmax = Math.max(r0, r1);

    var x0 = Math.floor(Math.min(ax, bx) - rmax - 1), x1 = Math.ceil(Math.max(ax, bx) + rmax + 1);
    var y0 = Math.floor(Math.min(ay, by) - rmax - 1), y1 = Math.ceil(Math.max(ay, by) + rmax + 1);
    if (x0 < this.bx0) x0 = this.bx0; if (y0 < this.by0) y0 = this.by0;
    if (x1 > this.bx1) x1 = this.bx1; if (y1 > this.by1) y1 = this.by1;

    for (var y = y0; y < y1; y++) {
      for (var x = x0; x < x1; x++) {
        var vx = x + 0.5 - ax, vy = y + 0.5 - ay;
        var t = (vx * ux + vy * uy) / seg;
        if (t < 0) t = 0; else if (t > 1) t = 1;

     * see it. Light moves that connected may cancel after their active
     * frames. */
    var d0 = f.def();
    var canCancel = f.hitLanded && d0.hit && f.progress() > d0.hit[1] && d0.dmg <= 10;
    if (!f.canAct() && !canCancel) return;

    var fwd = f.facing > 0 ? c.r : c.l;
    var back = f.facing > 0 ? c.l : c.r;

    if (!f.onGround) return;

    // double-tap dash
    var tapKey = fwd ? 'f' : (back ? 'b' : null);
    if (tapKey) {
      var lt = f.lastTap, now = this.tick || 0;
      if (!f.tapHeld) {
        if (lt && lt.k === tapKey && now - lt.t < 16) {
          f.start(tapKey === 'f' ? 'dash' : 'backdash');
          f.vx = f.facing * (tapKey === 'f' ? 300 : -260);
          this.fx.dust(f.x, GROUND, 6, f.facing);
          f.lastTap = null; f.tapHeld = 1;
          return;
        }
        f.lastTap = { k: tapKey, t: now };
      }
      f.tapHeld = 1;
    } else f.tapHeld = 0;

    if (c.s && f.meter >= 100) { f.start('special'); f.vx = f.facing * 40; return; }
    if (c.g) { f.start('grab'); return; }
    if (c.p) { f.start(c.d ? 'uppercut' : (back ? 'hook' : 'jab')); return; }
    if (c.k) { f.start(c.d ? 'sweep' : (back ? 'roundhouse' : (c.u ? 'highKick' : 'lowKick'))); return; }
    if (c.u) { f.start('jump'); f.vy = -600; f.onGround = false; f.vx = (fwd ? f.facing : back ? -f.facing : 0) * 118;
      this.fx.dust(f.x, f.y, 7, 1); return; }
    if (c.d) { f.start(back ? 'blockLow' : 'crouch'); return; }
    if (back) { f.start('block'); f.vx = -f.facing * 78; return; }
    if (fwd) { f.start('walk'); f.vx = f.facing * 108; return; }
    f.start('idle');
  };

  Match.prototype.ai = function (f, foe, i, dt) {
    var c = { l: 0, r: 0, u: 0, d: 0, p: 0, k: 0, s: 0, g: 0 };
    this.aiT[i] -= dt;
    var dist = Math.abs(foe.x - f.x);
    var toward = foe.x > f.x ? 'r' : 'l';
    var away = foe.x > f.x ? 'l' : 'r';

    // react to an incoming attack
    var fd = foe.def();
    var incoming = fd.hit && foe.progress() < fd.hit[1] && dist < 96;
    if (incoming && Math.random() < 0.6) {
      c[away] = 1;
      if (fd.low) c.d = 1;
      return c;
    }
    if (this.aiT[i] > 0) return this.aiHold[i] || c;

    if (f.meter >= 100 && dist < 90 && Math.random() < 0.5) { c.s = 1; this.aiT[i] = 0.9; this.aiHold[i] = c; return c; }
    if (dist > 108) { c[toward] = 1; this.aiT[i] = 0.12 + Math.random() * 0.2; this.aiHold[i] = c; return c; }
    if (dist > 74) {
      if (Math.random() < 0.42) { c.k = 1; c.u = Math.random() < 0.4 ? 1 : 0; }
      else c[toward] = 1;
      this.aiT[i] = 0.22 + Math.random() * 0.3;
      return c;
    }
    var r = Math.random();
    if (r < 0.30) c.p = 1;
    else if (r < 0.46) { c.p = 1; c.d = 1; }
    else if (r < 0.60) c.k = 1;
    else if (r < 0.68) c.g = 1;
    else if (r < 0.78) { c.u = 1; c[toward] = 1; }
    else if (r < 0.90) { c[away] = 1; }
    else c.d = 1;
    this.aiT[i] = 0.20 + Math.random() * 0.34;
    return c;
  };

  Match.prototype.step = function (dt) {
    this.tick = (this.tick || 0) + 1;
    this.fx.update(dt);
    if (this.fx.hitstop > 0) { this.fx.hitstop -= dt; return; }

    if (this.bannerT > 0) this.bannerT -= dt;
    if (!this.over) {
      this.time -= dt;
      if (this.time <= 0) { this.time = 0; this.finish(this.a.hp >= this.b.hp ? 0 : 1); }
    }

    var ca = this.over ? {} : (this.demo ? this.ai(this.a, this.b, 0, dt) : this.readInput());
    var cb = this.over ? {} : this.ai(this.b, this.a, 1, dt);

    this.drive(this.a, ca, this.b);
    this.drive(this.b, cb, this.a);

    this.a.setGround(GROUND); this.b.setGround(GROUND);
    this.a.update(dt, ca); this.b.update(dt, cb);

    this.resolve(this.a, this.b);
    this.resolve(this.b, this.a);


    // walls and body separation
    [this.a, this.b].forEach(function (f) {
      if (f.x < WALL_L) { f.x = WALL_L; f.vx = Math.max(0, f.vx); }
      if (f.x > WALL_R) { f.x = WALL_R; f.vx = Math.min(0, f.vx); }
    });
    var gap = this.b.x - this.a.x;
    if (Math.abs(gap) < 36) {
      var push = (36 - Math.abs(gap)) * 0.5 * Math.sign(gap || 1);
      this.a.x -= push; this.b.x += push;
    }

    if (!this.over && (this.a.hp <= 0 || this.b.hp <= 0)) {
      this.finish(this.a.hp <= 0 ? 1 : 0);
    }
    if (this.over) {
      this.over -= dt;
      if (this.over <= 0) { this.round++; this.reset(); this.say('ROUND ' + this.round, 1.4); }
    }
  };

  Match.prototype.finish = function (winner) {
    if (this.over) return;
    this.over = 3.4;
    this.wins[winner]++;
    var w = winner ? this.b : this.a;
    var l = winner ? this.a : this.b;
    w.start('victory'); l.hp = 0; l.start('defeat');
    this.say('K.O.', 2.2);
    this.fx.flash = 0.9;
    this.fx.shake = 0.9;
    if (this.onSound) this.onSound('ko');
  };

  Match.prototype.readInput = function () {
    var i = this.input;
    return { l: i.l, r: i.r, u: i.u, d: i.d, p: i.p, k: i.k, s: i.s, g: i.g };
  };

  /* ---- render --------------------------------------------------------- */

  Match.prototype.render = function () {
    var surf = this.surf, S = SCALE;

    // follow the midpoint, held back from the stage edges
    var mid = (this.a.x + this.b.x) * 0.5 - W * 0.5;
    var want = Math.max(-46, Math.min(46, mid));
    this.camV += (want - this.camX) * 9 * (1 / 60);
    this.camV *= 0.82;
    this.camX += this.camV;

    /* Screen shake, as a decaying oscillation along the hit direction --
     * white noise reads as a rattle, a sine reads as an impact. */
    var ox = 0, oy = 0;
    if (this.fx.shake > 0) {
      var k = this.fx.shake * this.fx.shake * 16 * S;
      this.shakeT = (this.shakeT || 0) + 1;
      ox = Math.sin(this.shakeT * 1.9) * k * (this.fx.shakeDir || 1);
      oy = Math.sin(this.shakeT * 2.7) * k * 0.45;
    }
    /* Parallax: sky barely moves, the temple wall drifts, the floor tracks
     * the fighters exactly so their feet stay glued to it. */
    var cx = this.camX * S;
    var skyY = (GROUND - 132) * S, flrY = GROUND * S;
    surf.copyBand(this.bg, 0, skyY, ox - cx * 0.15);
    surf.copyBand(this.bg, skyY, flrY, ox - cx * 0.55);
    surf.copyBand(this.bg, flrY, surf.h, ox - cx);

    var pan = ox - cx;
    this.sh.ox = pan; this.sh.oy = oy;

    F.drawShadowAt(surf, this.a, GROUND, S, pan, oy);
    F.drawShadowAt(surf, this.b, GROUND, S, pan, oy);

    // far fighter first
    var order = this.a.y <= this.b.y ? [this.a, this.b] : [this.b, this.a];
    for (var i = 0; i < 2; i++) {
      var f = order[i];
      var b = F.fighterBounds(f);
      this.sh.begin(b.x0, b.y0, b.x1, b.y1);
      F.drawFighter(this.sh, f);
      // motion arc: the working limb's recent path, additively. Free from a
      // solved pose; a sprite sheet would need extra art for every frame.
      var tc = f.skin.tint;
      for (var g = 0; g < f.trail.length; g++) {
        var seg = f.trail[g], al = 0.055 + g * 0.032;
        surf.addStreak(seg[0][0] * S + pan, seg[0][1] * S + oy,
          seg[1][0] * S + pan, seg[1][1] * S + oy, 5 * S, tc[0], tc[1], tc[2], al * 0.5);
        surf.addStreak(seg[1][0] * S + pan, seg[1][1] * S + oy,
          seg[2][0] * S + pan, seg[2][1] * S + oy, 4.5 * S, tc[0], tc[1], tc[2], al);
      }
    }

    this.fx.draw(surf, pan, oy);
    this.sh.ox = 0; this.sh.oy = 0;
    if (this.fx.flash > 0) {
      surf.blendRect(0, 0, surf.w, surf.h, 255, 244, 230, this.fx.flash * 0.5);
    }
    this.hud(surf);
    surf.present();
  };

  /* Chunky vector HUD, drawn with rectangles -- no font asset. */
  /* `ghost` is the chip bar: the damage you just took, draining a beat
   * behind the real value. Its absence was the most conspicuous thing
   * missing from the frame. */
  function bar(surf, x, y, w, h, frac, r, g, b, flip, ghost) {
    surf.fillRect(x - 3, y - 3, w + 6, h + 6, F.rgb(14, 12, 18));
    surf.fillRect(x - 1, y - 1, w + 2, h + 2, F.rgb(74, 66, 74));
    surf.fillRect(x, y, w, h, F.rgb(38, 32, 40));
    var gw, gx;
    if (ghost !== undefined && ghost > frac) {
      gw = Math.max(0, Math.min(1, ghost)) * w;
      gx = flip ? x + w - gw : x;
      surf.fillRect(gx, y, gw, h, F.rgb(238, 214, 120));
    }
    var fw = Math.max(0, Math.min(1, frac)) * w;
    var bx = flip ? x + w - fw : x;
    surf.fillRect(bx, y, fw, h, F.rgb(r, g, b));
    surf.fillRect(bx, y, fw, h * 0.30,
      F.rgb(Math.min(255, r + 70), Math.min(255, g + 70), Math.min(255, b + 60)));
    surf.fillRect(bx, y + h - Math.max(1, h * 0.16), fw, Math.max(1, h * 0.16),
      F.rgb(r * 0.55, g * 0.55, b * 0.55));
  }

  /* A 3x5 bitmap font written as rows, because the packed-hex version of
   * this was wrong in a dozen places and spelled the fighters' names
   * incorrectly. Rows are legible; hex is not. */
  var FONT = {
    'A': '010101111101101', 'B': '110101110101110', 'C': '011100100100011',
    'D': '110101101101110', 'E': '111100110100111', 'F': '111100110100100',
    'G': '011100101101011', 'H': '101101111101101', 'I': '111010010010111',
    'J': '001001001101010', 'K': '101101110101101', 'L': '100100100100111',
    'M': '101111111101101', 'N': '110101101101101', 'O': '010101101101010',
    'P': '110101110100100', 'Q': '010101101110011', 'R': '110101110101101',
    'S': '011100010001110', 'T': '111010010010010', 'U': '101101101101011',
    'V': '101101101101010', 'W': '101101111111101', 'X': '101101010101101',
    'Y': '101101010010010', 'Z': '111001010100111',
    '0': '111101101101111', '1': '010110010010111', '2': '111001111100111',
    '3': '111001111001111', '4': '101101111001001', '5': '111100111001111',
    '6': '111100111101111', '7': '111001001001001', '8': '111101111101111',
    '9': '111101111001111',
    '.': '000000000000010', '!': '010010010000010', '-': '000000111000000',
    ' ': '000000000000000'
  };
  function glyph(surf, ch, x, y, px, c) {
    var g = FONT[ch]; if (!g) return;
    for (var r = 0; r < 5; r++) {
      for (var k = 0; k < 3; k++) {
        if (g.charCodeAt(r * 3 + k) === 49) surf.fillRect(x + k * px, y + r * px, px, px, c);
      }
    }
  }
  function text(surf, str, x, y, px, c, shadow) {
    str = String(str).toUpperCase();
    for (var i = 0; i < str.length; i++) {
      if (shadow !== undefined) glyph(surf, str[i], x + i * px * 4 + px, y + px, px, shadow);
      glyph(surf, str[i], x + i * px * 4, y, px, c);
    }
  }
  function textW(str, px) { return String(str).length * px * 4 - px; }
  F.text = text; F.textW = textW;

  Match.prototype.hud = function (surf) {
    var S = SCALE, w = surf.w;
    var bw = 186 * S, bh = 13 * S, by = 14 * S;
    // chip bars trail the real value
    if (this.ghostA === undefined) { this.ghostA = 1; this.ghostB = 1; }
    var ha = this.a.hp / this.a.maxHp, hb = this.b.hp / this.b.maxHp;
    this.ghostA += (ha - this.ghostA) * 0.055; if (this.ghostA < ha) this.ghostA = ha;
    this.ghostB += (hb - this.ghostB) * 0.055; if (this.ghostB < hb) this.ghostB = hb;
    // low health pulses toward white
    function hc(fr, t) {
      if (fr > 0.25) return [226, 72, 62];
      var k = 0.5 + 0.5 * Math.sin(t * 0.42);
      return [226 + 29 * k, 72 + 150 * k, 62 + 140 * k];
    }
    var ca = hc(ha, this.tHud || 0), cb2 = hc(hb, this.tHud || 0);
    this.tHud = (this.tHud || 0) + 1;
    bar(surf, 20 * S, by, bw, bh, ha, ca[0], ca[1], ca[2], false, this.ghostA);
    bar(surf, w - 20 * S - bw, by, bw, bh, hb, cb2[0], cb2[1], cb2[2], true, this.ghostB);
    // super meters
    bar(surf, 20 * S, by + bh + 5 * S, bw * 0.62, 5 * S, this.a.meter / 100, 90, 190, 255, false);
    bar(surf, w - 20 * S - bw * 0.62, by + bh + 5 * S, bw * 0.62, 5 * S, this.b.meter / 100, 90, 190, 255, true);

    text(surf, this.a.name, 20 * S, by + bh + 13 * S, 1.6 * S, F.rgb(240, 226, 200), F.rgb(10, 8, 12));
    var nb = this.b.name;
    text(surf, nb, w - 20 * S - textW(nb, 1.6 * S), by + bh + 13 * S, 1.6 * S, F.rgb(240, 226, 200), F.rgb(10, 8, 12));

    // timer
    var ts = String(Math.max(0, Math.ceil(this.time)));
    if (ts.length < 2) ts = '0' + ts;
    var tp = 4 * S;
    surf.fillRect(w / 2 - 22 * S, by - 3 * S, 44 * S, 26 * S, F.rgb(18, 16, 22));
    text(surf, ts, w / 2 - textW(ts, tp) / 2, by + 1 * S, tp, F.rgb(255, 236, 190), F.rgb(20, 10, 8));

    // round pips
    for (var i = 0; i < 2; i++) {
      for (var k = 0; k < 2; k++) {
        var px = i ? w - 26 * S - k * 12 * S : 20 * S + k * 12 * S;
        var on = this.wins[i] > k;
        surf.fillRect(px, by + bh + 22 * S, 7 * S, 7 * S, on ? F.rgb(255, 206, 90) : F.rgb(58, 50, 56));
      }
    }

    if (this.bannerT > 0 && this.banner) {
      var a = Math.min(1, this.bannerT * 1.6);
      var pop = 1 + 0.35 * Math.exp(-(2.4 - this.bannerT) * 7);
      var bp = 6.4 * S * Math.min(1.28, pop);
      var bwid = textW(this.banner, bp);
      var yy = 56 * S;
      // a scrim keeps the banner off the fighters' faces
      surf.blendRect(0, yy - 7 * S, w, bp * 5 + 14 * S, 8, 4, 10, 0.40 * a);
      text(surf, this.banner, w / 2 - bwid / 2, yy, bp, F.rgb(255, 234, 186), F.rgb(150, 24, 24));
    }
    for (var ci = 0; ci < 2; ci++) {
      var cf = ci ? this.b : this.a;
      if (cf.combo < 2) continue;
      var cs = cf.combo + ' HIT';
      var cp = 2.6 * S * (1 + 0.55 * Math.exp(-(cf.comboT || 0) * 0.35));
      cf.comboT = (cf.comboT || 0) + 1;
      text(surf, cs, ci ? w - 26 * S - textW(cs, cp) : 26 * S, 64 * S, cp,
        F.rgb(255, 210, 120), F.rgb(20, 10, 8));
    }
    if (this.demo) {
      text(surf, 'DEMO', w / 2 - textW('DEMO', 2 * S) / 2, surf.h - 16 * S, 2 * S,
        F.rgb(200, 190, 180), F.rgb(10, 8, 12));
    }
  };

  Match.prototype.frame = function (now) {
    if (!this.last) this.last = now;
    var dt = Math.min(60, now - this.last) / 1000;
    this.last = now;
    this.acc += dt;
    var fixed = 1 / 60;
    var n = 0;
    while (this.acc >= fixed && n < 4) { this.step(fixed); this.acc -= fixed; n++; }
    this.render();
  };

  F.Match = Match;
  F.GROUND = GROUND;
  F.WORLD = { W: W, H: H, SCALE: SCALE };
})(FX);

  (function () {
    var canvas = document.getElementById('screen');
    var m = new FX.Match(canvas);
    window.__match = m;

    var snd = new FX.Sound();
    m.onSound = function (k) { snd.play(k); };

    var KEYS = { ArrowLeft:'l', ArrowRight:'r', ArrowUp:'u', ArrowDown:'d',
      KeyA:'l', KeyD:'r', KeyW:'u', KeyS:'d',
      KeyJ:'p', KeyK:'k', KeyL:'g', Semicolon:'s',
      KeyZ:'p', KeyX:'k', KeyC:'g', KeyV:'s' };
    // the hint uses A/S/D/F for attacks; map those too without breaking WASD
    KEYS.KeyF = 's';
    function takeOver() { if (m.demo) { m.demo = false; m.say('FIGHT', 1.2); } snd.enable(); }
    window.addEventListener('keydown', function (e) {
      var k = KEYS[e.code];
      if (e.code === 'KeyA' || e.code === 'KeyS' || e.code === 'KeyD') {
        // A/S/D double as attacks once the player has taken control
        k = e.code === 'KeyA' ? 'p' : e.code === 'KeyS' ? 'k' : 'g';
      }
      if (!k) return;
      e.preventDefault(); takeOver(); m.input[k] = 1;
    }, { passive:false });
    window.addEventListener('keyup', function (e) {
      var k = KEYS[e.code];
      if (e.code === 'KeyA') k = 'p'; if (e.code === 'KeyS') k = 'k'; if (e.code === 'KeyD') k = 'g';
      if (!k) return; e.preventDefault(); m.input[k] = 0;
    }, { passive:false });

    var pad = document.getElementById('pad');
    if (pad) {
      var btns = pad.querySelectorAll('[data-k]');
      for (var i = 0; i < btns.length; i++) (function (el) {
        var k = el.getAttribute('data-k');
        function dn(e) { e.preventDefault(); takeOver(); m.input[k] = 1; el.classList.add('on'); }
        function up(e) { e.preventDefault(); m.input[k] = 0; el.classList.remove('on'); }
        el.addEventListener('touchstart', dn, { passive:false });
        el.addEventListener('touchend', up, { passive:false });
        el.addEventListener('touchcancel', up, { passive:false });
        el.addEventListener('mousedown', dn); el.addEventListener('mouseup', up);
        el.addEventListener('mouseleave', up);
      })(btns[i]);
    }
    canvas.addEventListener('pointerdown', takeOver);

    function fit() {
      var padEl = document.getElementById('pad');
      var ph = padEl && getComputedStyle(padEl).display !== 'none' ? padEl.offsetHeight : 0;
      var hintEl = document.getElementById('hint');
      var hh = hintEl && getComputedStyle(hintEl).display !== 'none' ? hintEl.offsetHeight : 0;
      var aw = window.innerWidth - 6, ah = window.innerHeight - ph - hh - 6;
      var sc = Math.min(aw / canvas.width, ah / canvas.height);
      canvas.style.width = Math.round(canvas.width * sc) + 'px';
      canvas.style.height = Math.round(canvas.height * sc) + 'px';
    }
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', function () { setTimeout(fit, 120); });
    fit();

    m.say('ROUND 1', 1.6);
    function loop(t) { m.frame(t); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);
  })();
  
</script>
